[build]
  publish = "."

[dev]
  command = "node scripts/preview-server.cjs"
  targetPort = 4173
  port = 8888
  framework = "#static"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"
